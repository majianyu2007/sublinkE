      tolerance: 50
      include-all-proxies: true
      filter: "(?i)(法国|法國|德国|德國|荷兰|荷蘭|英国|英國|芬兰|芬蘭|瑞典|意大利|🇫🇷|🇩🇪|🇳🇱|🇬🇧|🇫🇮|🇸🇪|🇮🇹|(^|[_ -])(FR|DE|NL|GB|UK|FI|SE|IT)([_ -]|$)|France|Germany|Netherlands|Britain|United[ _-]?Kingdom|Finland|Sweden|Italy)"
      empty-fallback: REJECT
      proxies: []
    - name: 🌏 其他地区
      type: url-test
      url: https://www.gstatic.com/generate_204
      interval: 300
      tolerance: 50
      include-all-proxies: true
      exclude-filter: "(?i)(香港|港|台湾|台灣|日本|新加坡|狮城|獅城|美国|美國|韩国|韓國|欧洲|歐洲|加拿大|(^|[_ -])(HK|TW|JP|SG|US|USA|KR|RO|DE|NL|GB|UK|FI|UA|SE|CZ|LT|TR|RU|FR|PL|EE|IT|CA)([_ -]|$)|Hong[ _-]?Kong|Taiwan|Taipei|Japan|Tokyo|Osaka|Singapore|United[ _-]?States|Los[ _-]?Angeles|New[ _-]?York|Korea|Seoul|Romania|Germany|Netherlands|Britain|Finland|Ukraine|Sweden|Czech|Lithuania|Turkey|Russia|France|Poland|Estonia|Italy|Canada|Toronto|Vancouver|Montreal)"
      empty-fallback: REJECT
      proxies: []
    - name: 🌐 全部节点
      type: select
      include-all-proxies: true
      proxies: []
