allow-lan: false
bind-address: '*'
disable-keep-alive: false
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  cache-algorithm: arc
  use-hosts: true
  use-system-hosts: true
  # Every Mihomo lookup, including proxy-node bootstrap, goes to the local
  # AdGuard Home instance.  AdGuard Home owns upstream encryption/filtering.
  default-nameserver:
    - 127.0.0.1
  nameserver:
    - 127.0.0.1
  proxy-server-nameserver:
    - 127.0.0.1
external-controller: 127.0.0.1:9090
ipv6: false
keep-alive-idle: 600
keep-alive-interval: 15
log-level: info
mixed-port: 7892
mode: rule
port: 7890
profile:
    store-fake-ip: true
    store-selected: true
proxies: ~
proxy-groups:
    - name: ⭐ 自建优质节点
      type: select
      include-all-proxies: true
      exclude-filter: "(?i)^Purens_"
      empty-fallback: REJECT
      proxies: []
    - name: ⚡ 自建自动优选
      type: url-test
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
      timeout: 5000
      tolerance: 80
      max-failed-times: 3
      include-all-proxies: true
      exclude-filter: "(?i)^Purens_"
      empty-fallback: REJECT
      proxies: []
    - name: PROXY
      type: select
      include-all-proxies: false
      proxies:
        - ⭐ 自建优质节点
        - ⚡ 自建自动优选
        - AUTO
        - FALLBACK
        - 🇭🇰 香港节点
        - 🚩 台湾节点
        - 🇯🇵 日本节点
        - 🇸🇬 新加坡节点
        - 🇺🇸 美国节点
        - 🇰🇷 韩国节点
        - 🇪🇺 欧洲节点
        - 🇨🇦 加拿大节点
        - 🇷🇴 罗马尼亚节点
        - 🌍 西欧节点
        - 🌏 其他地区
        - 🌐 全部节点
        - DIRECT
    - name: AUTO
      type: url-test
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
      timeout: 5000
      tolerance: 80
      max-failed-times: 3
      include-all-proxies: true
      proxies: []
    - name: FALLBACK
      type: fallback
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
      timeout: 5000
      include-all-proxies: true
      proxies: []
    - name: 🇭🇰 香港节点
      type: url-test
      url: https://www.gstatic.com/generate_204
      interval: 300
      tolerance: 50
      include-all-proxies: true
      filter: "(?i)(香港|港|🇭🇰|(^|[_ -])HK([_ -]|$)|Hong[ _-]?Kong)"
      empty-fallback: REJECT
      proxies: []
    - name: 🚩 台湾节点
      type: url-test
      url: https://www.gstatic.com/generate_204
      interval: 300
      tolerance: 50
      include-all-proxies: true
      filter: "(?i)(台湾|台灣|(^|[_ -])TW([_ -]|$)|Taiwan|Taipei)"
      empty-fallback: REJECT
      proxies: []
    - name: 🇯🇵 日本节点
      type: url-test
      url: https://www.gstatic.com/generate_204
      interval: 300
      tolerance: 50
      include-all-proxies: true
      filter: "(?i)(日本|🇯🇵|(^|[_ -])JP([_ -]|$)|Japan|Tokyo|Osaka)"
      empty-fallback: REJECT
      proxies: []
    - name: 🇸🇬 新加坡节点
      type: url-test
      url: https://www.gstatic.com/generate_204
      interval: 300
      tolerance: 50
      include-all-proxies: true
      filter: "(?i)(新加坡|狮城|獅城|🇸🇬|(^|[_ -])SG([_ -]|$)|Singapore)"
      empty-fallback: REJECT
      proxies: []
    - name: 🇺🇸 美国节点
      type: url-test
      url: https://www.gstatic.com/generate_204
      interval: 300
      tolerance: 50
      include-all-proxies: true
      filter: "(?i)(美国|美國|🇺🇸|(^|[_ -])(US|USA)([_ -]|$)|United[ _-]?States|Los[ _-]?Angeles|New[ _-]?York)"
      empty-fallback: REJECT
      proxies: []
    - name: 🇰🇷 韩国节点
      type: url-test
      url: https://www.gstatic.com/generate_204
      interval: 300
      tolerance: 50
      include-all-proxies: true
      filter: "(?i)(韩国|韓國|🇰🇷|(^|[_ -])KR([_ -]|$)|Korea|Seoul)"
