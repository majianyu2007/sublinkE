sniffer:
    enable: true
    force-dns-mapping: true
    override-destination: true
    parse-pure-ip: true
    skip-domain:
        - Mijia Cloud
        - +.push.apple.com
    sniff:
        HTTP:
            override-destination: true
            ports:
                - 80
                - 8080-8880
        QUIC:
            ports:
                - 443
                - 8443
        TLS:
            ports:
                - 443
                - 8443
socks-port: 7891
tcp-concurrent: true
tun:
    auto-detect-interface: true
    auto-route: true
    dns-hijack:
        - any:53
        - tcp://any:53
    enable: true
    mtu: 1500
    stack: mixed
    strict-route: true
    udp-timeout: 300
unified-delay: true
