      empty-fallback: REJECT
      proxies: []
    - name: 🇨🇦 加拿大节点
      type: url-test
      url: https://www.gstatic.com/generate_204
      interval: 300
      tolerance: 50
      include-all-proxies: true
      filter: "(?i)(加拿大|🇨🇦|(^|[_ -])CA([_ -]|$)|Canada|Toronto|Vancouver|Montreal)"
      empty-fallback: REJECT
      proxies: []
    - name: 🇷🇴 罗马尼亚节点
      type: url-test
      url: https://www.gstatic.com/generate_204
      interval: 300
      tolerance: 50
      include-all-proxies: true
      filter: "(?i)(罗马尼亚|羅馬尼亞|🇷🇴|(^|[_ -])RO([_ -]|$)|Romania|Bucharest)"
      empty-fallback: REJECT
      proxies: []
    - name: 🌍 西欧节点
      type: url-test
      url: https://www.gstatic.com/generate_204
